<style>
:root{color-scheme:dark;--base:#10141d;--panel:#181f2b;--line:#343d4d;--fg:#f5f7fa;--muted:#b8c5d5;--accent:#ffcb79;--good:#9ee8bd;--bad:#ffb3af;font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#2f2a27,transparent 55%),var(--base);color:var(--fg);min-height:100vh}
header{border-bottom:1px solid var(--line);padding:20px max(5vw,20px);font-weight:750;display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{background:none;border:0;padding:0;color:var(--fg);font-weight:800;letter-spacing:-.025em;cursor:pointer}.brand b{color:var(--accent)}

.hero{display:grid;grid-template-columns:1fr minmax(245px,.6fr);gap:36px;align-items:center;margin-bottom:44px}.hero p{margin-bottom:0}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid button{text-align:left;display:flex;flex-direction:column;gap:7px;justify-content:center;min-height:94px;width:100%}.grid small{color:var(--muted);font-size:.875rem;font-weight:400}
button{font:inherit;font-weight:650;color:var(--fg);background:#202939;border:1px solid var(--line);padding:10px 15px;border-radius:9px;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.55;cursor:default}button.primary{background:var(--accent);color:#251908;border-color:transparent}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.question{max-width:820px;margin:18px auto;padding:clamp(16px,4vw,34px)}.quiz{max-width:820px;margin:auto}.question h1{font-size:clamp(1.35rem,3vw,2rem);line-height:1.3;letter-spacing:-.025em;margin:12px 0 18px}.options{display:grid;gap:8px;margin:0 0 19px}.option{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:#322a22}.option input{width:17px;height:17px;flex-shrink:0;margin:4px 0 0;accent-color:var(--accent)}.option.correct{border-color:#55916b;background:#193226}.option.wrong{border-color:#a55b60;background:#3b252b}.explain{border-top:1px solid var(--line);padding-top:17px;margin-bottom:18px}.tag{color:var(--muted);font-size:.9rem}.good{color:var(--good)}.bad{color:var(--bad)}progress{width:100%;height:7px;accent-color:var(--accent);display:block;margin-top:11px}details{margin-top:10px}summary{cursor:pointer;font-weight:650}details p{margin:12px 0 0}.ref{overflow-wrap:anywhere;font-size:.875rem;margin-bottom:0}.moduleTitle{margin-bottom:14px}#done{font-variant-numeric:tabular-nums}
@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr;gap:20px;margin-bottom:30px}}@media(max-width:440px){.grid{grid-template-columns:1fr}.grid button{min-height:72px}header{font-size:.875rem}}
</style>

const BANK = {"files":[["Cloud Concepts","Module 1 - Cloud Concepts Overview (1).pdf"],["Economics & Billing","Module 2-Cloud Economics and Billing.pdf"],["Global Infrastructure","Module 3 - AWS Global Infrastructure Overview.pdf"],["Cloud Security","Module 4 - AWS Cloud Security.pdf"],["Networking & CDN","Module 5 - Networking and Content Delivery.pdf"],["Compute","Module 6 - Compute (10).pdf"],["Storage","Module 7 - Storage (7).pdf"],["Databases","598125257_AWS_Academy_Cloud_Foundations_Module_08_Student_Guide.pdf"],["Cloud Architecture","Module 9 - Cloud Architecture.pdf"],["Scaling & Monitoring","Module 10 - Auto Scaling and Monitoring.pdf"],["Containers & Docker","Module08_Cloud_Developing.pdf"],["Caching & CloudFront","Module09_Cloud_Developing.pdf"]],"questions":[{"id":"0-0-case","m":0,"group":0,"kind":"case","stem":"A lab wants rented virtual servers and will patch its own guest OS. Which model fits?","options":["IaaS","PaaS","SaaS","Managed database as a service","Serverless functions"],"correct":[0],"explanation":"Гостевой ОС управляет клиент.","refs":["13"]},{"id":"0-0-single","m":0,"group":0,"kind":"single","stem":"Which statement accurately describes IaaS?","options":["Gives the customer control of the guest OS.","Requires the customer to maintain physical hosts.","Delivers only raw compute and network capacity.","Requires moving every application off premises.","Requires the provider to maintain the customer's guest OS."],"correct":[0],"explanation":"Гостевой ОС управляет клиент.","refs":["13"]},{"id":"0-0-binary","m":0,"group":0,"kind":"binary","stem":"IaaS requires the provider to maintain the customer's guest OS.","options":["True","False"],"correct":[1],"explanation":"Гостевой ОС управляет клиент.","refs":["13"]},{"id":"0-1-case","m":0,"group":1,"kind":"case","stem":"A startup wants to deploy its code to a managed runtime without maintaining the OS. Which model fits?","options":["PaaS","IaaS","SaaS","Private cloud","On-premises hosting"],"correct":[0],"explanation":"Провайдер обслуживает платформу, а клиент отвечает за своё приложение.","refs":["13"]},{"id":"0-1-single","m":0,"group":1,"kind":"single","stem":"Which statement accurately describes PaaS?","options":["Provides a managed platform for deploying custom code.","Delivers only raw compute and network capacity.","Requires moving every application off premises.","Requires keeping peak capacity for the whole year.","Requires the customer to maintain physical hosts."],"correct":[0],"explanation":"Провайдер обслуживает платформу, а клиент отвечает за своё приложение.","refs":["13"]},{"id":"0-1-binary","m":0,"group":1,"kind":"binary","stem":"PaaS provides a managed platform for deploying custom code.","options":["True","False"],"correct":[0],"explanation":"Провайдер обслуживает платформу, а клиент отвечает за своё приложение.","refs":["13"]},{"id":"0-2-case","m":0,"group":2,"kind":"case","stem":"Employees need a complete hosted email application they can use immediately. Which model fits?","options":["SaaS","PaaS","IaaS","Private cloud","Bare-metal hosting"],"correct":[0],"explanation":"Клиент пользуется готовым приложением и управляет своими настройками.","refs":["13"]},{"id":"0-2-single","m":0,"group":2,"kind":"single","stem":"Which statement accurately describes SaaS?","options":["Delivers a finished application managed by the provider.","Requires moving every application off premises.","Requires keeping peak capacity for the whole year.","Depends on buying physical hardware before each test.","Delivers only raw compute and network capacity."],"correct":[0],"explanation":"Клиент пользуется готовым приложением и управляет своими настройками.","refs":["13"]},{"id":"0-2-binary","m":0,"group":2,"kind":"binary","stem":"SaaS delivers only raw compute and network capacity.","options":["True","False"],"correct":[1],"explanation":"Клиент пользуется готовым приложением и управляет своими настройками.","refs":["13"]},{"id":"0-3-case","m":0,"group":3,"kind":"case","stem":"A hospital connects its internal scheduling system to applications running in the public cloud. Which deployment model fits?","options":["Hybrid cloud","Public cloud only","On-premises only","Multi-Region public cloud","Single-AZ public cloud"],"correct":[0],"explanation":"Часть систем остаётся локальной и работает вместе с облачными ресурсами.","refs":["14"]},{"id":"0-3-single","m":0,"group":3,"kind":"single","stem":"Which statement accurately describes Hybrid cloud?","options":["Combines cloud resources with on-premises resources.","Requires keeping peak capacity for the whole year.","Depends on buying physical hardware before each test.","Focuses primarily on network topology.","Requires moving every application off premises."],"correct":[0],"explanation":"Часть систем остаётся локальной и работает вместе с облачными ресурсами.","refs":["14"]},{"id":"0-3-binary","m":0,"group":3,"kind":"binary","stem":"Hybrid cloud combines cloud resources with on-premises resources.","options":["True","False"],"correct":[0],"explanation":"Часть систем остаётся локальной и работает вместе с облачными ресурсами.","refs":["14"]},{"id":"0-4-case","m":0,"group":4,"kind":"case","stem":"A publisher buys too many servers for annual events. Which cloud advantage directly addresses that sizing problem?","options":["Stop guessing capacity","Go global in minutes","Increase speed and agility","Improve physical server access","Benefit from economies of scale"],"correct":[0],"explanation":"Ресурсы можно увеличить на пике и освободить после него.","refs":["20"]},{"id":"0-4-single","m":0,"group":4,"kind":"single","stem":"Which statement accurately describes Stop guessing capacity?","options":["Lets a team adjust available resources to match demand.","Depends on buying physical hardware before each test.","Focuses primarily on network topology.","Requires the provider to maintain the customer's guest OS.","Requires keeping peak capacity for the whole year."],"correct":[0],"explanation":"Ресурсы можно увеличить на пике и освободить после него.","refs":["20"]},{"id":"0-4-binary","m":0,"group":4,"kind":"binary","stem":"Stop guessing capacity requires keeping peak capacity for the whole year.","options":["True","False"],"correct":[1],"explanation":"Ресурсы можно увеличить на пике и освободить после него.","refs":["20"]},{"id":"0-5-case","m":0,"group":5,"kind":"case","stem":"A developer needs a test environment today and cannot wait for hardware procurement. Which advantage matters most?","options":["Increase speed and agility","Stop guessing capacity","Go global in minutes","Benefit from economies of scale","Gain direct access to physical servers"],"correct":[0],"explanation":"Новое окружение можно поднять за минуты и быстрее проверить идею.","refs":["21"]},{"id":"0-5-single","m":0,"group":5,"kind":"single","stem":"Which statement accurately describes Increase speed and agility?","options":["Shortens the time needed to provision resources for experiments.","Focuses primarily on network topology.","Requires the provider to maintain the customer's guest OS.","Requires the customer to maintain physical hosts.","Depends on buying physical hardware before each test."],"correct":[0],"explanation":"Новое окружение можно поднять за минуты и быстрее проверить идею.","refs":["21"]},{"id":"0-5-binary","m":0,"group":5,"kind":"binary","stem":"Increase speed and agility shortens the time needed to provision resources for experiments.","options":["True","False"],"correct":[0],"explanation":"Новое окружение можно поднять за минуты и быстрее проверить идею.","refs":["21"]},{"id":"0-6-case","m":0,"group":6,"kind":"case","stem":"A migration manager is planning staff training and changes to job roles. Which perspective is most relevant?","options":["AWS CAF People perspective","Governance","Platform","Operations","Business"],"correct":[0],"explanation":"Подготовка людей и управление изменениями относятся к перспективе People.","refs":["38"]},{"id":"0-6-single","m":0,"group":6,"kind":"single","stem":"Which statement accurately describes AWS CAF People perspective?","options":["Focuses on skills, staffing, and organizational change.","Requires the provider to maintain the customer's guest OS.","Requires the customer to maintain physical hosts.","Delivers only raw compute and network capacity.","Focuses primarily on network topology."],"correct":[0],"explanation":"Подготовка людей и управление изменениями относятся к перспективе People.","refs":["38"]},{"id":"0-6-binary","m":0,"group":6,"kind":"binary","stem":"AWS CAF People perspective focuses primarily on network topology.","options":["True","False"],"correct":[1],"explanation":"Подготовка людей и управление изменениями относятся к перспективе People.","refs":["38"]},{"id":"0-7-double","m":0,"group":7,"kind":"double","stem":"A team is deciding how much control to retain when moving code into the cloud. Which TWO statements are correct?","options":["IaaS gives the customer control of the guest OS.","PaaS provides a managed platform for deploying custom code.","IaaS transfers application source code ownership to the infrastructure provider.","PaaS requires customers to replace failed server hardware.","SaaS gives end users administrative access to the provider’s physical hosts."],"correct":[0,1],"explanation":"Гостевой ОС управляет клиент. Провайдер обслуживает платформу, а клиент отвечает за своё приложение.","refs":["13"]},{"id":"1-0-case","m":1,"group":0,"kind":"case","stem":"A team has no AWS usage yet and needs an estimate for a proposed workload. Which tool fits?","options":["AWS Pricing Calculator","AWS Cost Explorer","AWS Budgets","AWS Cost and Usage Report","Total Cost of Ownership"],"correct":[0],"explanation":"Можно ввести конфигурацию и прогноз нагрузки до запуска ресурсов.","refs":["26"]},{"id":"1-0-single","m":1,"group":0,"kind":"single","stem":"Which statement accurately describes AWS Pricing Calculator?","options":["Estimates charges for a planned configuration.","Sets the maximum size of an Auto Scaling group.","Requires budget thresholds to be expressed as CPU percentages.","Only provides an aggregate total.","Requires a paid AWS bill before it can calculate anything."],"correct":[0],"explanation":"Можно ввести конфигурацию и прогноз нагрузки до запуска ресурсов.","refs":["26"]},{"id":"1-0-binary","m":1,"group":0,"kind":"binary","stem":"AWS Pricing Calculator estimates charges for a planned configuration.","options":["True","False"],"correct":[0],"explanation":"Можно ввести конфигурацию и прогноз нагрузки до запуска ресурсов.","refs":["26"]},{"id":"1-1-case","m":1,"group":1,"kind":"case","stem":"Finance wants a chart of last quarter's spending grouped by service. Which tool fits?","options":["AWS Cost Explorer","AWS Budgets","AWS Cost and Usage Report","Total Cost of Ownership","Consolidated billing"],"correct":[0],"explanation":"Группировка по сервису покажет, куда ушла большая часть бюджета.","refs":["52"]},{"id":"1-1-single","m":1,"group":1,"kind":"single","stem":"Which statement accurately describes AWS Cost Explorer?","options":["Visualizes historical AWS spending by dimensions such as service.","Requires budget thresholds to be expressed as CPU percentages.","Only provides an aggregate total.","Excludes facilities and labor by definition.","Sets the maximum size of an Auto Scaling group."],"correct":[0],"explanation":"Группировка по сервису покажет, куда ушла большая часть бюджета.","refs":["52"]},{"id":"1-1-binary","m":1,"group":1,"kind":"binary","stem":"AWS Cost Explorer sets the maximum size of an Auto Scaling group.","options":["True","False"],"correct":[1],"explanation":"Группировка по сервису покажет, куда ушла большая часть бюджета.","refs":["52"]},{"id":"1-2-case","m":1,"group":2,"kind":"case","stem":"A team wants an alert when forecast monthly spending exceeds its target. Which tool fits?","options":["AWS Budgets","AWS Cost and Usage Report","Total Cost of Ownership","Consolidated billing","Service control policy"],"correct":[0],"explanation":"Для предупреждения можно использовать прогноз затрат.","refs":["53"]},{"id":"1-2-single","m":1,"group":2,"kind":"single","stem":"Which statement accurately describes AWS Budgets?","options":["Supports alerts based on a forecast spending threshold.","Only provides an aggregate total.","Excludes facilities and labor by definition.","Requires every team to use a single AWS account.","Requires budget thresholds to be expressed as CPU percentages."],"correct":[0],"explanation":"Для предупреждения можно использовать прогноз затрат.","refs":["53"]},{"id":"1-2-binary","m":1,"group":2,"kind":"binary","stem":"AWS Budgets supports alerts based on a forecast spending threshold.","options":["True","False"],"correct":[0],"explanation":"Для предупреждения можно использовать прогноз затрат.","refs":["53"]},{"id":"1-3-case","m":1,"group":3,"kind":"case","stem":"An analyst wants detailed AWS billing line items for an internal data pipeline. Which export fits?","options":["AWS Cost and Usage Report","Total Cost of Ownership","Consolidated billing","Service control policy","AWS Pricing Calculator"],"correct":[0],"explanation":"Отчёт позволяет обрабатывать детализацию затрат в собственных инструментах.","refs":["54"]},{"id":"1-3-single","m":1,"group":3,"kind":"single","stem":"Which statement accurately describes AWS Cost and Usage Report?","options":["Provides granular billing and usage records.","Excludes facilities and labor by definition.","Requires every team to use a single AWS account.","Directly grants permissions to IAM users.","Only provides an aggregate total."],"correct":[0],"explanation":"Отчёт позволяет обрабатывать детализацию затрат в собственных инструментах.","refs":["54"]},{"id":"1-3-binary","m":1,"group":3,"kind":"binary","stem":"AWS Cost and Usage Report only provides an aggregate total.","options":["True","False"],"correct":[1],"explanation":"Отчёт позволяет обрабатывать детализацию затрат в собственных инструментах.","refs":["54"]},{"id":"1-4-case","m":1,"group":4,"kind":"case","stem":"A manager must compare hosting options including facilities, hardware, and staff time. Which concept fits?","options":["Total Cost of Ownership","Consolidated billing","Service control policy","AWS Pricing Calculator","AWS Cost Explorer"],"correct":[0],"explanation":"TCO включает приобретение и эксплуатацию, в том числе работу сотрудников.","refs":["21"]},{"id":"1-4-single","m":1,"group":4,"kind":"single","stem":"Which statement accurately describes Total Cost of Ownership?","options":["Compares direct and indirect costs over the lifetime of a solution.","Requires every team to use a single AWS account.","Directly grants permissions to IAM users.","Requires a paid AWS bill before it can calculate anything.","Excludes facilities and labor by definition."],"correct":[0],"explanation":"TCO включает приобретение и эксплуатацию, в том числе работу сотрудников.","refs":["21"]},{"id":"1-4-binary","m":1,"group":4,"kind":"binary","stem":"Total Cost of Ownership compares direct and indirect costs over the lifetime of a solution.","options":["True","False"],"correct":[0],"explanation":"TCO включает приобретение и эксплуатацию, в том числе работу сотрудников.","refs":["21"]},{"id":"1-5-case","m":1,"group":5,"kind":"case","stem":"A firm wants one bill covering all member accounts. Which feature fits?","options":["Consolidated billing","Service control policy","AWS Pricing Calculator","AWS Cost Explorer","AWS Budgets"],"correct":[0],"explanation":"Аккаунты остаются отдельными, а оплата собирается в одном счёте.","refs":["42"]},{"id":"1-5-single","m":1,"group":5,"kind":"single","stem":"Which statement accurately describes Consolidated billing?","options":["Combines member account charges into a single bill.","Directly grants permissions to IAM users.","Requires a paid AWS bill before it can calculate anything.","Sets the maximum size of an Auto Scaling group.","Requires every team to use a single AWS account."],"correct":[0],"explanation":"Аккаунты остаются отдельными, а оплата собирается в одном счёте.","refs":["42"]},{"id":"1-5-binary","m":1,"group":5,"kind":"binary","stem":"Consolidated billing requires every team to use a single AWS account.","options":["True","False"],"correct":[1],"explanation":"Аккаунты остаются отдельными, а оплата собирается в одном счёте.","refs":["42"]},{"id":"1-6-case","m":1,"group":6,"kind":"case","stem":"A company wants a permissions ceiling for member accounts in an organizational unit. Which policy fits?","options":["Service control policy","AWS Pricing Calculator","AWS Cost Explorer","AWS Budgets","AWS Cost and Usage Report"],"correct":[0],"explanation":"SCP задаёт верхнюю границу разрешений. Сами разрешения выдаются отдельными политиками.","refs":["43"]},{"id":"1-6-single","m":1,"group":6,"kind":"single","stem":"Which statement accurately describes Service control policy?","options":["Limits the maximum permissions available in affected member accounts.","Requires a paid AWS bill before it can calculate anything.","Sets the maximum size of an Auto Scaling group.","Requires budget thresholds to be expressed as CPU percentages.","Directly grants permissions to IAM users."],"correct":[0],"explanation":"SCP задаёт верхнюю границу разрешений. Сами разрешения выдаются отдельными политиками.","refs":["43"]},{"id":"1-6-binary","m":1,"group":6,"kind":"binary","stem":"A Service control policy limits the maximum permissions available in affected member accounts.","options":["True","False"],"correct":[0],"explanation":"SCP задаёт верхнюю границу разрешений. Сами разрешения выдаются отдельными политиками.","refs":["43"]},{"id":"1-7-double","m":1,"group":7,"kind":"double","stem":"Finance wants to estimate a proposed AWS environment and compare lifetime costs with on-premises hosting. Which TWO statements are correct?","options":["AWS Pricing Calculator estimates charges for a planned configuration.","Total Cost of Ownership compares direct and indirect costs over the lifetime of a solution.","AWS Budgets requires a deployed workload in order to estimate its planned instance configuration.","TCO includes only the purchase price of servers.","AWS Cost Explorer visualizes deployment costs on servers outside AWS automatically."],"correct":[0,1],"explanation":"Можно ввести конфигурацию и прогноз нагрузки до запуска ресурсов. TCO включает приобретение и эксплуатацию, в том числе работу сотрудников.","refs":["26","21"]},{"id":"2-0-case","m":2,"group":0,"kind":"case","stem":"An architect must choose the geographic area where AWS resources will be deployed. Which AWS infrastructure scope is being selected?","options":["AWS Region","Availability Zone","Edge location","Data residency","Service availability"],"correct":[0],"explanation":"Регион — географическая область, включающая несколько зон доступности.","refs":["10"]},{"id":"2-0-single","m":2,"group":0,"kind":"single","stem":"Which statement accurately describes AWS Region?","options":["Contains multiple Availability Zones in a geographic area.","Is another name for an EC2 Availability Zone.","Specifies only how long a DNS response can be cached.","Is guaranteed to be identical across all Regions.","Is a subdivision of a single Availability Zone."],"correct":[0],"explanation":"Регион — географическая область, включающая несколько зон доступности.","refs":["10"]},{"id":"2-0-binary","m":2,"group":0,"kind":"binary","stem":"AWS Region is a subdivision of a single Availability Zone.","options":["True","False"],"correct":[1],"explanation":"Регион — географическая область, включающая несколько зон доступности.","refs":["10"]},{"id":"2-1-case","m":2,"group":1,"kind":"case","stem":"A team wants two isolated deployment locations within one Region. Which infrastructure unit should it spread instances across?","options":["Availability Zone","Edge location","Data residency","Service availability","Elasticity"],"correct":[0],"explanation":"Распределение по разным зонам снижает риск отказа всей системы пр  пограничных точек.","refs":["38–39"]},{"id":"11-3-single","m":11,"group":3,"kind":"single","stem":"Which statement accurately describes Amazon CloudFront?","options":["Is a CDN that caches eligible content closer to viewers.","Specifies the maximum memory of a Redis node.","Fills the cache for every write even when no read requests that record.","Updates the cache only after a read request misses.","Acts as a standby database for cross-AZ failover."],"correct":[0],"explanation":"CloudFront доставляет подходящие ответы с пограничных точек.","refs":["38–39"]},{"id":"11-3-binary","m":11,"group":3,"kind":"binary","stem":"Amazon CloudFront acts as a standby database for cross-AZ failover.","options":["True","False"],"correct":[1],"explanation":"CloudFront доставляет подходящие ответы с пограничных точек.","refs":["38–39"]},{"id":"11-4-case","m":11,"group":4,"kind":"case","stem":"An origin varies responses at the same path by a selected query parameter. What determines whether CloudFront caches those responses separately?","options":["CloudFront cache key","Lazy loading","Write-through caching","Amazon ElastiCache","Cache miss penalty"],"correct":[0],"explanation":"Включение значимого параметра в ключ позволяет хранить разные версии отдельно.","refs":["42–44"]},{"id":"11-4-single","m":11,"group":4,"kind":"single","stem":"Which statement accurately describes CloudFront cache key?","options":["Determines which request attributes distinguish cached responses.","Fills the cache for every write even when no read requests that record.","Updates the cache only after a read request misses.","Is designed for long-term cold object archives.","Specifies the maximum memory of a Redis node."],"correct":[0],"explanation":"Включение значимого параметра в ключ позволяет хранить разные версии отдельно.","refs":["42–44"]},{"id":"11-4-binary","m":11,"group":4,"kind":"binary","stem":"A CloudFront cache key determines which request attributes distinguish cached responses.","options":["True","False"],"correct":[0],"explanation":"Включение значимого параметра в ключ позволяет хранить разные версии отдельно.","refs":["42–44"]},{"id":"11-5-case","m":11,"group":5,"kind":"case","stem":"A service should cache only requested records, loading them from the database when a lookup misses. Which strategy fits?","options":["Lazy loading","Write-through caching","Cache prewarming","Scheduled refresh","Cache bypass"],"correct":[0],"explanation":"Кэш заполняется по обращению после промаха. Первый запрос может быть медленнее.","refs":["56–58"]},{"id":"11-5-single","m":11,"group":5,"kind":"single","stem":"Which statement accurately describes Lazy loading?","options":["Populates the cache after a requested record is missing.","Updates the cache only after a read request misses.","Is designed for long-term cold object archives.","Is the time saved on a cache hit.","Fills the cache for every write even when no read requests that record."],"correct":[0],"explanation":"Кэш заполняется по обращению после промаха. Первый запрос может быть медленнее.","refs":["56–58"]},{"id":"11-5-binary","m":11,"group":5,"kind":"binary","stem":"Lazy loading fills the cache for every write even when no read requests that record.","options":["True","False"],"correct":[1],"explanation":"Кэш заполняется по обращению после промаха. Первый запрос может быть медленнее.","refs":["56–58"]},{"id":"11-6-case","m":11,"group":6,"kind":"case","stem":"A product app must update the cache whenever a price is successfully written to the database. Which strategy fits?","options":["Write-through caching","Lazy loading","Cache bypass","Scheduled refresh","TTL-only expiration"],"correct":[0],"explanation":"Кэш обновляется в процессе записи данных, чтобы новые значения были доступны для чтения.","refs":["59–60"]},{"id":"11-6-single","m":11,"group":6,"kind":"single","stem":"Which statement accurately describes Write-through caching?","options":["Updates cached data as part of the database write workflow.","Is designed for long-term cold object archives.","Is the time saved on a cache hit.","Guarantees immediate refresh on every database write.","Updates the cache only after a read request misses."],"correct":[0],"explanation":"Кэш обновляется в процессе записи данных, чтобы новые значения были доступны для чтения.","refs":["59–60"]},{"id":"11-6-binary","m":11,"group":6,"kind":"binary","stem":"Write-through caching updates cached data as part of the database write workflow.","options":["True","False"],"correct":[0],"explanation":"Кэш обновляется в процессе записи данных, чтобы новые значения были доступны для чтения.","refs":["59–60"]},{"id":"11-7-double","m":11,"group":7,"kind":"double","stem":"A team is evaluating whether to populate cache entries on read misses or update them as part of a database write. Which TWO statements are correct?","options":["Lazy loading populates the cache after a requested record is missing.","Write-through caching updates cached data as part of the database write workflow.","Lazy loading requires every written record to be inserted into the cache even if it is never requested.","Using write-through guarantees no cache miss can ever occur.","Cache eviction writes the evicted value back to the database in both strategies."],"correct":[0,1],"explanation":"Кэш заполняется по обращению после промаха. Первый запрос может быть медленнее. Кэш обновляется в процессе записи данных, чтобы новые значения были доступны для чтения.","refs":["56–58","59–60"]}]};
const {files,questions}=BANK;
const view=document.getElementById('view');
const done=document.getElementById('done');
const labels={case:'Ситуация',single:'Один ответ',binary:'True / False',double:'Choose TWO'};
let stats={};
try{stats=JSON.parse(localStorage.getItem('aws-exam-v1')||'{}')||{}}catch{}
let run=null;
function node(tag,value,cls){
  const item=document.createElement(tag);
  if(value!==undefined)item.textContent=value;
  if(cls)item.className=cls;
  return item;
}
function button(value,action,cls,type='button'){
  const element=node('button',value,cls);
  element.type=type;
  if(action)element.addEventListener('click',action);
  return element;
}
function row(...items){
  const box=node('div',undefined,'row');
  box.append(...items);
  return box;
}
function summary(){
  done.textContent=questions.filter(q=>Object.hasOwn(stats,q.id)).length+' / '+questions.length+' пройдено';
}
function moduleName(i){
  return (i<10?'Foundations '+(i+1):'Developing '+(i-3))+' · '+files[i][0];
}
function home(){
  run=null;
  summary();
  const hero=node('section',undefined,'hero');
  const left=node('div');
  left.append(node('p','AWS Cloud Foundations + Cloud Developing','eyebrow'),node('h1','Подготовка к сессии'),node('p','264 вопроса на английском по 12 лекциям. Разборы на русском с номерами страниц в PDF.'));
  const exam=node('div',undefined,'card exam');
  exam.append(node('h2','Пробная сессия'),node('p','25 смешанных вопросов. Результат и разбор после сдачи.'),button('Начать сессию',startExam,'primary'));
  hero.append(left,exam);
  const grid=node('div',undefined,'grid');
  files.forEach(([name],i)=>{
    const items=questions.filter(q=>q.m===i);
    const seen=items.filter(q=>Object.hasOwn(stats,q.id)).length;
    const title=i<10?'Foundations '+(i+1):'Developing '+(i-3);
    const tile=button(name,()=>start(items,'training',moduleName(i)));
    tile.append(node('small',title+' · '+seen+' / '+items.length+' пройдено'));
    grid.append(tile);
  });
  const title=row(node('h2','Тренировка по лекциям','moduleTitle'));
  title.classList.add('spread');
  const errors=questions.filter(q=>stats[q.id]===false);
  if(errors.length)title.append(button('Повторить ошибки · '+errors.length,()=>start(errors,'training','Работа над ошибками')));
  view.replaceChildren(hero,title,grid);
}
function shuffled(list){
  const result=[...list];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function startExam(){
  const blocks=files.map((_,m)=>questions.filter(q=>q.m===m));
  const doubleModules=new Set(shuffled(files.map((_,i)=>i)).slice(0,3));
  const binaryModules=new Set(shuffled(files.map((_,i)=>i).filter(i=>!doubleModules.has(i))).slice(0,4));
  const chosen=blocks.flatMap((block,m)=>{
    const second=shuffled(block.filter(q=>q.kind===(doubleModules.has(m)?'double':binaryModules.has(m)?'binary':'single')))[0];
    const first=shuffled(block.filter(q=>q.kind==='case'&&q.group!==second.group))[0];
    return [first,second];
  });
  const extra=shuffled(questions.filter(q=>q.kind==='case'&&!chosen.some(c=>c.m===q.m&&c.group===q.group)))[0];
  start(shuffled([...chosen,extra]),'exam','Пробная сессия');
}
function start(items,mode,title){
  run={items:items.map(q=>({...q,order:q.kind==='binary'?[0,1]:shuffled(q.options.map((_,i)=>i))})),mode,title,index:0,replies:new Map()};
  render();
}
function correct(q,selected){
  return q.correct.length===selected.length&&q.correct.every(k=>selected.includes(k));
}
function record(q,selected){
  stats[q.id]=correct(q,selected);
  try{localStorage.setItem('aws-exam-v1',JSON.stringify(stats))}catch{}
  summary();
}
function refs(q){
  return 'Источник · '+files[q.m][1]+' · стр. PDF '+q.refs.join(', ');
}
function answers(q,indices){
  return indices.map(i=>q.options[i]).join(' / ');
}
function render(){
  const {items,mode,title,index,replies}=run;
  const q=items[index];
  const selected=replies.get(q.id)||[];
  const locked=mode==='training'&&replies.has(q.id);
  const wrap=node('div',undefined,'quiz');
  const bar=row(node('strong',title),node('span',(index+1)+' / '+items.length,'tag'));
  bar.classList.add('spread');
  const meter=node('progress');
  meter.max=items.length;
  meter.value=index+1;
  meter.setAttribute('aria-label','Номер вопроса');
  const card=node('article',undefined,'question');
  const form=node('form');
  const heading=node('h1',q.stem);
  heading.lang='en';
  heading.tabIndex=-1;
  const list=node('div',undefined,'options');
  list.lang='en';
  const limit=q.correct.length;
  const submit=button(locked?(index===items.length-1?'Завершить':'Следующий вопрос'):mode==='training'?'Проверить':index===items.length-1?'Сдать сессию':'Следующий вопрос',null,'primary','submit');
  const inputs=[];
  for(const i of q.order){
    const option=node('label',undefined,'option');
    const input=node('input');
    input.type=limit===2?'checkbox':'radio';
    input.name='answer';
    input.value=i;
    input.checked=selected.includes(i);
    if(locked){
      input.disabled=true;
      if(q.correct.includes(i))option.classList.add('correct');
      else if(input.checked)option.classList.add('wrong');
    }
    option.append(input,node('span',q.options[i]));
    inputs.push(input);
    list.append(option);
  }
  function selection(){return inputs.filter(i=>i.checked).map(i=>Number(i.value))}
  function sync(){
    const size=selection().length;
    submit.disabled=!locked&&size!==limit;
    if(limit===2&&!locked)for(const i of inputs)i.disabled=!i.checked&&size===limit;
  }
  list.addEventListener('change',sync);
  sync();
  if(mode==='exam')list.addEventListener('change',()=>replies.set(q.id,selection()));
  card.append(node('div',labels[q.kind]+(limit===2?' · выбери 2 ответа':''),'eyebrow'),heading);
  form.append(list);
  if(locked){
    const ok=correct(q,selected);
    const explanation=node('div',undefined,'explain');
    explanation.setAttribute('role','status');
    explanation.append(node('strong',ok?'Верно':'Правильный ответ · '+answers(q,q.correct),ok?'good':'bad'),node('p',q.explanation),node('p',refs(q),'ref'));
    form.append(explanation);
  }
  const actions=row(submit);
  if(mode==='exam'&&index>0)actions.append(button('Предыдущий',()=>{run.index--;render()}));
  form.append(actions);
  form.addEventListener('submit',event=>{
    event.preventDefault();
    if(!locked){
      const values=selection();
      if(values.length!==limit)return;
      replies.set(q.id,values);
      if(mode==='training'){record(q,values);render();return}
    }
    if(index===items.length-1){
      const unanswered=items.findIndex(question=>(replies.get(question.id)||[]).length!==question.correct.length);
      if(unanswered>=0){run.index=unanswered;render();return}
      if(mode==='exam')for(const question of items)record(question,replies.get(question.id));
      results();
    }else{run.index++;render()}
  });
  card.append(form);
  wrap.append(bar,meter,card);
  view.replaceChildren(wrap);
  heading.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function results(){
  const {items,replies,title,mode}=run;
  const missed=items.filter(q=>!correct(q,replies.get(q.id)||[]));
  const wrap=node('div',undefined,'quiz');
  wrap.append(node('div',title,'eyebrow'),node('h1',(items.length-missed.length)+' из '+items.length),node('p',Math.round(100*(items.length-missed.length)/items.length)+'% правильных ответов'));
  const actions=row(button('К списку лекций',home,'primary'));
  if(missed.length)actions.append(button('Повторить ошибки',()=>start(missed,'training','Работа над ошибками')));
  if(mode==='exam')actions.append(button('Новая пробная сессия',startExam));
  wrap.append(actions);
  for(const q of [...missed,...items.filter(q=>!missed.includes(q))]){
    const ok=!missed.includes(q);
    const item=node('details');
    const title=node('summary',(ok?'Верно · ':'Ошибка · ')+q.stem,ok?'good':'bad');
    item.append(title,node('p','Твой ответ · '+answers(q,replies.get(q.id))),node('p','Правильный ответ · '+answers(q,q.correct)),node('p',q.explanation),node('p',refs(q),'ref'));
    wrap.append(item);
  }
  view.replaceChildren(wrap);
  window.scrollTo(0,0);
}
document.getElementById('home').addEventListener('click',home);
home();
</script>
</body>
</html>
